name: Update Year

on:
  schedule:
    - cron: '0 0 1 1 *'  # Runs every January 1st at midnight UTC
  workflow_dispatch:

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate current year JSON
        run: |
          YEAR=$(date +'%Y')
          echo "{\"schemaVersion\":1,\"label\":\"©\",\"message\":\"$YEAR Sun Dimitri NFANDA · All rights reserved.\",\"color\":\"blue\"}" > year.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add year.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update copyright year"
          git push
